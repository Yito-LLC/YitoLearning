<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel ="stylesheet" href = "style.css">
</head>
<body>
    <div class="black-box top-box"></div>
    <div class="black-box bottom-box"></div>

    <div class = "hero">
        <h1>Coming Soon</h1>
        <div class = "timebox">
            <div class ="time">
                <h2 id="months">00</h2>
                <p>Months</p>
            </div>
            <div class ="time">
                <h2 id="days">00</h2>
                <p>Days</p>
            </div>
            <div class ="time">
                <h2 id="hours">00</h2>
                <p>Hours</p>
            </div>
            <div class ="time">
                <h2 id="minutes">00</h2>
                <p>Minutes</p>
            </div>
            <div class ="time">
                <h2 id="seconds">00</h2>
                <p>Seconds</p>
            </div>
        </div>

    </div>
    <script src = "main.js"></script>

</body>
</html>
